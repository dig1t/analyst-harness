name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage -- --ci
      - run: npm run build
      - name: Lint the knowledge vault
        run: npm run vault:lint
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dashboard UI in a real browser
        run: npm run test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: analyst-harness:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm --read-only --tmpfs /tmp -v harness-ci:/app/data \
            -e HARNESS_PROVIDER=scripted analyst-harness:ci node dist/cli.js doctor || true
          docker run --rm --read-only --tmpfs /tmp -v harness-ci:/app/data \
            analyst-harness:ci node dist/cli.js scrapers
      - name: Smoke test the command sandbox (no network)
        run: |
          docker run --rm --read-only --tmpfs /tmp --network none \
            -v "$PWD/docker/sandbox-smoke.js:/smoke.js:ro" \
            --entrypoint node analyst-harness:ci /smoke.js
