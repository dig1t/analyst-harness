# Single-container deployment for a small VPS. Copy .env.example to .env first.
services:
  harness:
    image: ghcr.io/firebit-dev/analyst-harness:latest
    build: .
    container_name: analyst-harness
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    volumes:
      - harness-data:/app/data
    # The web port (health check and /dashboards/) stays on the host's loopback; the bot needs
    # no inbound ports. Use an SSH tunnel, a private network or a TLS proxy (docs/dashboards.md).
    ports:
      - '127.0.0.1:8080:8080'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  harness-data:
